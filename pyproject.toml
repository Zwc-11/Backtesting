[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "xasset"
version = "0.1.0"
description = "Cross-asset market-data recorder and quality foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "exchange-calendars>=4.11,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "networkx>=3.5,<4",
  "numpy>=2,<3",
  "polars>=1.34,<2",
  "pydantic>=2.12,<3",
  "pytz>=2025.2",  # DuckDB's Python TIMESTAMPTZ conversion requires pytz.
  "PyYAML>=6,<7",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "statsmodels>=0.14,<1",
  "uvicorn>=0.35,<1",
  "websockets>=15,<17",
]

[project.scripts]
xasset = "xasset.cli:main"
xasset-app = "xasset.application:main"

[tool.hatch.build.targets.sdist]
exclude = ["/artifacts"]

[dependency-groups]
dev = ["mypy>=1.18,<2", "pytest>=8.4,<10", "ruff>=0.14,<1", "types-PyYAML>=6"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts/backfill_equities.py"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "pandas.*", "statsmodels.*", "scipy.*", "sklearn.*", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
