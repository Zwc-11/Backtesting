# Live paper universe: prices, flow and quotes from public feeds; no orders are ever sent.
id: crypto-paper
description: 'Live paper universe: Binance spot coins (data-stream.binance.vision) and Hyperliquid perpetuals, with
  trades and best bid/ask.'
benchmark: BTCUSDT
minimum_peers: 20
pairs:
- leader: BTCUSDT
  laggards:
  - ETHUSDT
  - SOLUSDT
  - XRPUSDT
  - BNBUSDT
  - DOGEUSDT
  - ADAUSDT
  - LTCUSDT
  - BCHUSDT
  - LINKUSDT
  - AVAXUSDT
- leader: ETHUSDT
  laggards:
  - UNIUSDT
  - AAVEUSDT
  - ARBUSDT
  - ENAUSDT
handoff_calendar: XNYS
selection_note: Spot coins are the archive book's 28 coins (December-2025 Binance spot volume ranking, with the
  survivorship caveat documented there). Perpetuals are the same 12 underlyings on Hyperliquid, reachable without
  an account; ticks follow Hyperliquid's five-significant-figure price rule at the October-2026 configuration price
  and lots are its size decimals. Hyperliquid perpetuals are quoted in USDC and spot in USDT; both are treated as
  US dollars at par.
