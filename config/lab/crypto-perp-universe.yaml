handoff_calendar: XNYS
selection_note: Membership is recomputed for each month from 2024-01 to 2026-09 using only the previous
  complete month (a contract needs a bar on every day of it), from every contract ever archived, delisted
  ones included. Stablecoins, metals, composite indices and the stock, ETF and commodity perpetuals listed
  from January 2026 are excluded (reviewed list plus a point-in-time weekday-trading rule). Ticks and
  lots are inferred from archive prices and volumes (the futures API is unavailable here). Cost tiers
  follow each contract's median rank.
