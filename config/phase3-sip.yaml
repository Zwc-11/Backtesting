- id: 01-oil-equities
  title: Oil to energy stocks and airlines
  original_scope: WTI/Brent to energy and airlines at 5m, 1h and 1d.
  implemented_scope: 5-minute oil signals; long energy after oil rises or long airlines
    after oil falls; 15/60-minute holds.
  deferred_scope:
  - Separate 1h and 1d signal horizons
  - Short positions and simultaneous baskets
  - CME confirmation of any qualifying proxy result
  experiment:
    family: phase3-oil-equities-sip-v2
